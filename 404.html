<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | PE Midterm</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/PE_Midterm/img/favicon.svg" type="image/svg+xml">
<script>
try {
  var s = (JSON.parse(localStorage.getItem('pe-midterm-v1')) || {}).settings || {}, r = document.documentElement;
  var t = s.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : s.theme;
  if (t) r.dataset.theme = t;
  if (s.accent) r.dataset.accent = s.accent;
  if (s.accent === 'custom' && s.color) r.style.setProperty('--accent', s.color);
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/PE_Midterm/css/style.css?v=3.0">
<style>
  .nf { max-width: 640px; margin: 0 auto; padding: 12vh 16px 48px; }
  .nf-code { font: 700 clamp(88px, 22vw, 160px)/0.9 var(--head); color: var(--accent); margin: 0; }
  .nf h1 { font: 700 clamp(34px, 7vw, 48px)/1.05 var(--head); margin: 12px 0 10px; text-transform: uppercase; }
</style>
</head>
<body>
<main class="nf">
  <p class="nf-code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p class="note">That address doesn't go to anything on the PE Midterm site. It may be old or mistyped.</p>
  <p class="nf-links">
    <a class="btn solid" href="/PE_Midterm/">Go to Home</a>
    <a class="btn" href="/PE_Midterm/#units">See the units</a>
    <a class="btn" href="/PE_Midterm/#test">Practice test</a>
  </p>
</main>
</body>
</html>
